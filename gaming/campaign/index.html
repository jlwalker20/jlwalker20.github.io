<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d1f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Firefight Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=Barlow:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a campaign ledger. Standings and history on the Campaign tab, army sheets on Armies, a staged mission flow on Mission */
:root{
  --bg:#e9eae7; --surface:#f7f7f5; --sunk:#dcdeda; --fg:#1b1e1f; --muted:#5d6462; --line:#c7cbc6;
  --accent:#b86b00; --accent-ink:#ffffff; --a:#2f5f8f; --b:#9a3b2c; --danger:#b3261e; --good:#2b7a47;
  --display:"Oxanium","Eurostile","Bank Gothic",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111314; --surface:#1a1d1f; --sunk:#0b0d0e; --fg:#e6e8e6; --muted:#9aa29f; --line:#2c3134;
  --accent:#f2a93b; --accent-ink:#1a1206; --a:#7fb0e0; --b:#e58a78; --danger:#f2766c; --good:#6fd29a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111314; --surface:#1a1d1f; --sunk:#0b0d0e; --fg:#e6e8e6; --muted:#9aa29f; --line:#2c3134;
  --accent:#f2a93b; --accent-ink:#1a1206; --a:#7fb0e0; --b:#e58a78; --danger:#f2766c; --good:#6fd29a; color-scheme:dark}
*{box-sizing:border-box}
/* layout: phone by default; html.tab = tablet landscape */
[hidden]{display:none!important}
.pcols,.pcol{display:contents}
html.tab body{padding-left:calc(96px + max(20px,env(safe-area-inset-left,0px)));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:32px}
html.tab main{max-width:1440px}
html.tab nav.tabs{top:0;bottom:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:4px;border-top:0;border-right:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) 8px calc(16px + env(safe-area-inset-bottom,0px)) calc(8px + env(safe-area-inset-left,0px))}
html.tab nav.tabs a{font-size:.68rem;padding:10px 0;gap:4px}
html.tab nav.tabs a svg{width:26px;height:26px}
html.tab .pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
html.tab .pcol{display:flex;flex-direction:column;gap:22px;min-width:0}
html.tab .log{max-height:340px}
html.tab #v-combat{max-width:980px}
html.tab #rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;align-items:start}
html.tab #rules .group{display:contents}
html.tab #rules .group>.row,html.tab #rules .group>p{grid-column:1/-1}
html.tab #v-reminders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
html.tab #v-reminders>.stack:first-child{grid-column:1/-1}
html.tab .deck{grid-auto-columns:320px}
html.tab .sheet{align-items:center}
html.tab .sheet>.panel{border-radius:12px;max-width:680px;max-height:86vh;padding-bottom:18px}
.layoutbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lseg{display:grid;grid-template-columns:repeat(3,1fr);flex:1 1 240px;max-width:400px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lseg button{border:0;background:var(--surface);color:var(--fg);padding:8px 6px;min-height:40px;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.lseg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lchk{display:flex;gap:8px;align-items:center;font-size:.92rem}
.lchk input{width:20px;height:20px;accent-color:var(--accent)}
.lnote{font-size:.86rem;color:var(--muted)}

[hidden]{display:none!important}
.stack>.field,.sheet>.panel>.field{flex:none}
body{background:var(--bg);color:var(--fg);font:16.5px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.85rem;line-height:1.05;text-transform:uppercase;letter-spacing:.04em}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
section.view{display:flex;flex-direction:column;gap:22px;padding-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:9px 14px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip.warn{border-color:var(--accent);color:var(--accent)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.chip.dead{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.chip.ok{border-color:var(--good);color:var(--good)}
.ta{color:var(--a)} .tb{color:var(--b)}

.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:4px 12px;padding-top:18px;flex-wrap:wrap}
.masthead>div{min-width:0}
.masthead h1 span{color:var(--accent)}
.masthead p{font-size:.9rem;text-align:right}

/* round bar */
.roundbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:2px solid var(--fg)}
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.rounds div{height:8px;background:var(--sunk);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 100%,0 100%)}
.rounds div.past{background:var(--muted)}
.rounds div.now{background:var(--accent)}
.turnflag{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:6px;border:2px solid var(--line);background:var(--surface)}
.turnflag.pa{border-color:var(--a)} .turnflag.pb{border-color:var(--b)}
.turnflag b{font-family:var(--display);font-size:1.2rem}

/* score */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.army{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--a);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.army.b{border-top-color:var(--b)}
.army h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:var(--mono);font-size:2.2rem;font-weight:700;line-height:1}
.bar{display:flex;gap:3px}
.bar i{flex:1;height:6px;border-radius:1px;background:var(--sunk)}
.bar i.done{background:var(--muted)}
.obj{display:flex;flex-wrap:wrap;gap:8px}
.marker{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:700;padding:0}
.marker.oa{border:3px solid var(--a);color:var(--a);background:color-mix(in srgb,var(--a) 12%,var(--surface))}
.marker.ob{border:3px solid var(--b);color:var(--b);background:color-mix(in srgb,var(--b) 12%,var(--surface))}

/* units */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 6px;min-height:40px;font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.roster{display:flex;flex-direction:column;gap:8px}
.unit{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.unit.b{border-left-color:var(--b)}
.unit.spent{opacity:.6}
.unit.gone{opacity:.45}
.uhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.uhead h3{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qd{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.qd b{color:var(--fg)}
.hp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hpbar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.hpbar i{position:absolute;inset:0 auto 0 0;background:var(--good)}
.hpbar.half i{background:var(--accent)}
.hpbar.zero i{background:var(--danger)}
.hpbar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--fg);opacity:.35}
.stepper{display:flex;gap:4px;align-items:center}
.stepper button{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);background:var(--bg);font-weight:700;padding:0}
.stepper .num{min-width:3.4em;text-align:center;font-weight:700;font-size:.9rem}
.toggles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:4px 9px;min-height:32px;font-size:.84rem}
.tg[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.act{margin-left:auto}
.kws{display:flex;flex-wrap:wrap;gap:4px}
.kw{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:2px 7px;font-size:.76rem;font-weight:700;min-height:26px;color:var(--fg)}
.kw:hover{border-color:var(--accent)}
.group{display:flex;flex-direction:column;gap:8px}
.group+.group{margin-top:10px}
details.rule.dim{opacity:.55}
details.rule summary>span:first-child{flex:1;min-width:0}
details.rule .cnt{font-family:var(--mono);font-size:.78rem;font-weight:700;display:flex;gap:6px}
.used{font-size:.92rem}
details.ref{font-size:.9rem;border-top:1px dashed var(--line);padding-top:6px}
details.ref summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
details.ref p{margin-top:4px}

/* cards */
.callout{border-left:3px solid var(--accent);padding:8px 12px;background:var(--sunk);border-radius:0 4px 4px 0;font-size:.94rem}
.winner{border:2px solid var(--accent);text-align:center}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:220px;overflow:auto;font-size:.88rem}
.log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.log .r{font-family:var(--mono);color:var(--muted);flex:none;width:2.4em}

/* setup */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--display);font-size:1.05rem}
.mode small{color:var(--muted);font-size:.82rem}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.spec div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column}
.spec b{font-family:var(--mono);font-size:1.05rem}
.spec span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 110px}
.field label{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px 10px;min-height:42px;width:100%}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ulist li{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--bg)}
.ulist li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.checklist input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.checklist .n{font-family:var(--mono);color:var(--accent);font-weight:700}
.checklist li.done{opacity:.6}
.checklist li.done strong{text-decoration:line-through}
.checklist strong{display:block}
.checklist p{font-size:.92rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.93rem;min-height:30px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}

/* combat */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}
.need{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.need b{font-family:var(--mono);font-size:1.6rem}
.tray{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--sunk);border-radius:6px;min-height:52px}
.d6{width:38px;height:38px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.05rem;color:var(--muted)}
.d6.ok{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.d6.save{border-color:var(--good);color:var(--good)}
.d6.fail{border-color:var(--danger);color:var(--danger)}
.d6.pop{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.4) rotate(-60deg);opacity:.2}to{transform:none;opacity:1}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.facts div{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column}
.facts b{font-family:var(--mono);font-size:1.35rem}
.facts span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* rules */
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 14px;min-height:46px;width:100%}
details.rule{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.rule summary{padding:12px 14px;cursor:pointer;font-family:var(--display);font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.rule summary::-webkit-details-marker{display:none}
details.rule summary::after{content:"+";font-family:var(--mono);color:var(--accent)}
details.rule[open] summary::after{content:"–"}
details.rule .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:.96rem}
.body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 35%,transparent);color:inherit;border-radius:2px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 0;border-radius:4px;min-width:0;overflow:hidden}
.gapnote{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--accent);border-radius:6px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.flow div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.flow b{font-family:var(--display)}
.flow span{font-size:.9rem;color:var(--muted)}
.forget{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.forget div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.forget b{font-family:var(--display)}
.forget span{font-size:.92rem;color:var(--muted)}
.mu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.mu{grid-template-columns:1fr}}
.mu>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.kwrow{display:grid;grid-template-columns:6.8em 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:0}
.kwrow b{font-family:var(--display)}
.kwrow span{font-size:.88rem;color:var(--muted)}
textarea.notes{width:100%;min-height:120px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;font:inherit;line-height:1.45;resize:vertical}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
details.rem{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.rem>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;min-height:48px}
details.rem>summary::-webkit-details-marker{display:none}
details.rem .chev{width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.rem:not([open]) .chev{transform:rotate(-45deg);margin-top:0}
details.rem:not([open]){background:var(--sunk)}
details.rem:not([open]) h3{color:var(--muted)}
.rembody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.steps li::marker{color:var(--accent);font-family:var(--mono)}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--sunk)}
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 50%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet>.panel{width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:10px 10px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;min-height:64px}
.actions b{font-family:var(--display);font-size:1.05rem}
.actions small{color:var(--muted);font-size:.84rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.big{font-size:1.8rem}.actions{grid-template-columns:1fr}}

a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;align-self:flex-start}a.btn.primary{color:var(--accent-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}

.kw.tr{border-color:var(--accent)}.kw.sk{border-color:var(--a);color:var(--a)}.kw.ta{border-color:var(--good);color:var(--good)}.kw.in{border-color:var(--danger);color:var(--danger)}.kw.up{border-style:dashed}

/* rules reference for the Rules tab */
const CRULES=[
 ["Campaign types",`<ul><li><b>Game-limited:</b> play D3+4 missions. After the last one, most VP wins.</li><li><b>Point-limited:</b> the campaign ends when a player has D3+4 VP after a match, and that player wins.</li><li><b>Time-limited:</b> ends after D3+4 weeks; most VP wins.</li><li><b>Endless:</b> never ends; keep a running leaderboard.</li></ul>
 <p><b>Parallel play:</b> armies may play matches in parallel, but then each army's VP is divided by the matches it played. <b>Late joiners</b> start with a regular army and use the same VP division.</p>`],
 ["Preparation",`<ul><li>Each player starts with a 400 pt treasury.</li><li>Before the first mission, spend at least 320 pts on the army, with at most one Hero.</li><li>Give the army and every unit a unique name.</li></ul>
 <p>Each campaign cycle: <b>1</b> Mission setup · <b>2</b> Play mission · <b>3</b> Check for casualties · <b>4</b> Earn experience · <b>5</b> Upgrade armies · <b>6</b> Recruit units.</p>`],
 ["1 · Mission setup",`<ul><li><b>No points limit.</b> Bring any units (at least one), but your total may be at most 125 pts over the value of the army with the lowest points.</li>
 <li><b>Underdog bonus:</b> 1 underdog point per full 25 pts your army is below the highest-valued army. Spend one to change all dice in a friendly or enemy roll by +1 or −1; only one point per roll.</li>
 <li><b>Special objectives:</b> each army rolls one. Completing it puts 40 pts in its treasury. Re-roll objectives that can't be completed.</li></ul>`],
 ["2 · Play mission",`<ul><li>Standard rules, but if there's no winner after 4 rounds, keep playing rounds until there is one.</li><li><b>Conceding:</b> at the start of any round, remove all your units. They don't count as casualties.</li><li><b>Random events:</b> at the start of each round roll a die. On 5+, roll two dice (tens, then units) on the events table.</li><li><b>Mission goals:</b> the winner gets 2 VP and 80 pts; every losing army gets 160 pts.</li></ul>`],
 ["3 · Casualties",`<p>Units fully destroyed or Routed are casualties. Roll a die for each:</p><ul><li><b>1</b> Dead: remove it from the army sheet.</li><li><b>2–5</b> Recovered.</li><li><b>6</b> Natural Talent: recovers and earns +1 XP.</li></ul>
 <p><b>Heroes</b> use the same roll, but on a 1 the Hero counts as 15 pts cheaper and rolls on the Injury table, and on a 6 counts as 15 pts more expensive and rolls on the Talent table. Injuries and talents (except Natural Talent) can only be gained once; re-roll duplicates.</p>
 <p><b>No permadeath (optional):</b> instead of being removed, a dead unit loses the XP it earned that match and sits out the next D3 matches.</p>`],
 ["4 · Experience",`<ul><li>+1 XP: not a casualty</li><li>+1 XP: killed a unit</li><li>+2 XP: killed a Hero</li></ul>
 <p>Every 5 XP a unit levels up (max 30 XP, six levels). Regular units count as 15 pts more expensive per level and roll a trait. Heroes count as 25 pts more expensive and also get a skill trait: the first time, roll a skill set; then roll a skill from it each level. Traits can only be gained once (except Specialist); re-roll duplicates. A Hero with all three skills in its set rolls a new second set.</p>`],
 ["5 · Upgrade armies",`<ul><li>Buy upgrades with treasury points. Buying an upgrade worth less than 0 pts gives you those points.</li><li>Sell upgrades for half their price, rounded down to a multiple of 5. A 5 pt item sells for 5 pts on a 4+, one attempt per item after each mission.</li><li>Selling a negative-cost upgrade costs its full value.</li></ul>`],
 ["6 · Recruit units",`<ul><li>Recruit as many regular units as you like after each mission. One of them may start with 5 XP for +30 pts.</li><li>At most one new Hero after each mission, and at most 3 Heroes in the army.</li><li>Units may be disbanded for free, losing their XP and upgrades. You may also disband the whole army and start again from scratch.</li></ul>`]
];

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d6=()=>1+Math.floor(Math.random()*6);
const d3=()=>1+Math.floor(Math.random()*3);
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=s=>{try{return new Date(s+(s.length===10?"T12:00:00":"")).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}catch(e){return s}};
const LKEY="firefight-campaign-v1";

/* ---------- STORE: Supabase. Anyone can read; writes need the campaign password ---------- */
const CFG=window.GAMING_CONFIG||{};
const SLUG=(new URLSearchParams(location.search).get("c")||"").toLowerCase().replace(/[^a-z0-9-]/g,"");
const PKEY="gaming-campaign-pass:"+SLUG,MYKEY="gaming-campaign-mine:"+SLUG;
const D={camp:null,armies:{},matches:{},live:null};
let SB=null,MODE="loading",RO=true,STALE=false,ROW=null,PASS=null,MINE=null,LIST=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
PASS=SLUG?lsGet(PKEY):null;MINE=SLUG?lsGet(MYKEY):null;RO=!PASS;
const Q={};
function slot(path){const [c,id]=path.split("/");return {c,id}}
function setLocal(path,obj){const {c,id}=slot(path);
  if(c==="camp")D.camp=obj;else if(c==="live")D.live=obj;else if(D[c]){if(obj==null)delete D[c][id];else D[c][id]=obj}}
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}
const badPass=e=>/password/i.test((e&&(e.message||e.details||e.hint))||"");
function put(path,obj){
  if(MODE!=="db")return Promise.resolve(false);
  if(!PASS){setTimeout(unlockSheet,0);return Promise.resolve(false)}
  setLocal(path,obj==null?null:clone(obj));render();
  const run=async()=>{
    for(let i=0;i<2;i++){
      const {error}=await SB.rpc("gaming_put",{p_slug:SLUG,p_pass:PASS,p_path:path,p_data:obj==null?null:clone(obj)});
      if(!error)return true;
      if(badPass(error)){setPass(null);toast("The campaign password has changed. Unlock again to keep editing.");await fetchAll();return false}
      if(i===0&&/fetch|network|timeout/i.test(error.message||""))await new Promise(r=>setTimeout(r,800));else{toast("Couldn't save just now. "+(error.message||""));await fetchAll();return false}
    }
    return false};
  Q[path]=(Q[path]||Promise.resolve()).then(run);return Q[path];
}
function setPass(p){PASS=p;RO=!p;lsSet(PKEY,p);render()}
async function fetchAll(){
  const {data,error}=await SB.from("gaming_docs").select("path,data").eq("campaign",SLUG);
  if(error){STALE=true;render();return}
  D.camp=null;D.live=null;D.armies={};D.matches={};
  (data||[]).forEach(r=>setLocal(r.path,r.data));STALE=false;render();
}
async function boot(){
  render();
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||!window.supabase){MODE="noconfig";render();return}
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false}});
  if(!SLUG){MODE="lobby";render();loadLobby();return}
  const {data:row,error}=await SB.from("gaming_campaigns").select("slug,name,created_at,updated_at").eq("slug",SLUG).maybeSingle();
  if(error){MODE="offline";render();return}
  if(!row){MODE="missing";render();return}
  ROW=row;MODE="db";await fetchAll();
  if(PASS){const {data:ok}=await SB.rpc("gaming_check",{p_slug:SLUG,p_pass:PASS});if(ok===false){setPass(null);toast("The saved password no longer works. Unlock again to edit.")}}
  const apply=p=>{const r=p.new&&p.new.path?p.new:null;if(r&&r.campaign===SLUG){setLocal(r.path,r.data);render()}};
  SB.channel("gaming-"+SLUG)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"gaming_docs",filter:`campaign=eq.${SLUG}`},apply)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"gaming_docs",filter:`campaign=eq.${SLUG}`},apply)
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"gaming_docs"},p=>{const o=p.old||{};if(o.campaign===SLUG&&o.path){setLocal(o.path,null);render()}})
    .subscribe(st=>{if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){STALE=true;render()}else if(st==="SUBSCRIBED"&&STALE){fetchAll()}});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")fetchAll()});
  setInterval(()=>{if(document.visibilityState==="visible")fetchAll()},60000);
}
function unlockSheet(){
  sheet(`<h2>Unlock editing</h2><p class="muted">Anyone with the link can view this campaign. Enter the campaign password to make changes on this device.</p>
    ${field("pwIn","Campaign password","","password",'autocomplete="current-password"')}
    <p id="pwMsg" class="muted"></p>
    <div class="row"><button class="btn primary" id="pwGo" type="button">Unlock</button><button class="btn ghost" data-close type="button">Cancel</button></div>`,()=>{
    const go=async()=>{const p=$("#pwIn").value;if(!p)return;$("#pwGo").disabled=true;
      const {data,error}=await SB.rpc("gaming_check",{p_slug:SLUG,p_pass:p});
      if(error){$("#pwMsg").textContent="Couldn't check the password. Are you online?";$("#pwGo").disabled=false;return}

/* ---------- MODEL ---------- */
const armies=()=>Object.values(D.armies).sort((a,b)=>(a.created||0)-(b.created||0));
const army=id=>D.armies[id]||null;
const lvCost=u=>u.hero?25:15;
const upCost=u=>(u.ups||[]).reduce((s,x)=>s+(+x.cost||0),0);
const uval=u=>(+u.pts||0)+upCost(u)+(u.lv||0)*lvCost(u)+(+u.mod||0);
const aval=a=>(a.units||[]).reduce((s,u)=>s+uval(u),0);
const heroes=a=>(a.units||[]).filter(u=>u.hero).length;
const missions=()=>D.camp?D.camp.missions||0:0;
const ratio=a=>a.played?a.vp/a.played:0;
const useRatio=()=>D.camp&&D.camp.opts&&(D.camp.opts.parallel||D.camp.opts.late);
function standings(){return armies().slice().sort((x,y)=>useRatio()?ratio(y)-ratio(x)||y.vp-x.vp:y.vp-x.vp||y.treasury-x.treasury)}
function newUnit(o){return {id:rid(),name:o.name,base:o.base||o.name,models:o.models||1,q:o.q||4,d:o.d||4,tough:o.tough||1,hero:!!o.hero,
  pts:o.pts||0,rules:o.rules||"",weapons:o.weapons||"",xp:0,lv:0,traits:[],injuries:[],talents:[],sets:[],skills:[],mod:0,ups:[],sit:0,pend:[],joined:missions()}}
function uniqName(a,name,skip){const names=new Set((a.units||[]).filter(u=>u.id!==skip).map(u=>u.name.toLowerCase()));if(!names.has(name.toLowerCase()))return name;let i=2;while(names.has(`${name} ${i}`.toLowerCase()))i++;return `${name} ${i}`}
let LOGM=null;
function alog(a,t){a.log=[{m:LOGM??missions(),t,ts:Date.now()},...(a.log||[])].slice(0,80)}

/* XP and level-ups */
function addXP(a,u,n,why){
  const old=u.xp||0,nu=Math.max(0,Math.min(30,old+n));u.xp=nu;
  const lv=Math.floor(nu/5)-Math.floor(old/5);
  for(let i=0;i<lv;i++){u.lv=(u.lv||0)+1;u.pend=[...(u.pend||[]),{id:rid(),lv:u.lv}]}
  if(lv>0)alog(a,`${u.name} reached ${nu} XP and levelled up${lv>1?` ${lv} times`:""}${why?` (${why})`:""}.`);
  return lv;
}
/* trait rolling: re-roll duplicates; "pick" results return options */
function ownedTraits(u){return u.traits||[]}
function rollTrait(u){
  for(let i=0;i<60;i++){const r=d6(),name=TRAITS[r-1][0];
    if(r===6)return {roll:r,name,opts:traitOpts(u)};
    if(r===3)return {roll:r,name,opts:["Specialist (melee)","Specialist (shooting)"]};
    if(!ownedTraits(u).includes(name))return {roll:r,val:name}}
  return {roll:6,name:"Fast Learner",opts:traitOpts(u)};
}
function traitOpts(u){return TRAITS.slice(0,5).flatMap(([n])=>n==="Specialist"?["Specialist (melee)","Specialist (shooting)"]:ownedTraits(u).includes(n)?[]:[n])}
function rollInjury(u){for(let i=0;i<60;i++){const r=d6(),n=INJURIES[r-1][0];
  if(r===6)return {roll:r,name:n,opts:INJURIES.slice(1,5).map(x=>x[0]).filter(x=>!(u.injuries||[]).includes(x))};
  if(r===1||!(u.injuries||[]).includes(n))return {roll:r,val:n}}return {roll:1,val:"Dead"}}
function rollTalent(u){for(let i=0;i<60;i++){const r=d6(),n=TALENTS[r-1][0];
  if(r===6)return {roll:r,name:n,opts:TALENTS.slice(0,5).map(x=>x[0]).filter(x=>x==="Natural Talent"||!(u.talents||[]).includes(x))};
  if(r===1||!(u.talents||[]).includes(n))return {roll:r,val:n}}return {roll:1,val:"Natural Talent"}}
function curSet(u){const s=u.sets||[];return s[s.length-1]||null}
function setDone(u,set){return set&&SKILLS[set].every(([n])=>(u.skills||[]).includes(n))}
function needsSet(u){const s=curSet(u);return !s||setDone(u,s)}
function rollSet(u){for(let i=0;i<60;i++){const r=d6(),pair=SETPAIRS[Math.floor((r-1)/2)].filter(x=>!(u.sets||[]).includes(x));
  if(pair.length)return pair.length===1?{roll:r,val:pair[0]}:{roll:r,opts:pair}}return null}
function rollSkill(u,set){const left=SKILLS[set].filter(([n])=>!(u.skills||[]).includes(n));if(!left.length)return null;
  for(let i=0;i<60;i++){const r=d6(),n=SKILLS[set][Math.floor((r-1)/2)][0];if(!(u.skills||[]).includes(n))return {roll:r,val:n}}return {roll:0,val:left[0][0]}}
const desc=name=>{const base=name.replace(/ \((melee|shooting)\)$/,"");const all=[...TRAITS,...INJURIES,...TALENTS,...Object.values(SKILLS).flat()];const f=all.find(x=>x[0]===base);return f?f[1]:""};

/* text export for the game apps (Army Forge format) */
function exportText(a,ids){
  const us=(a.units||[]).filter(u=>!ids||ids.includes(u.id));
  const tot=us.reduce((s,u)=>s+uval(u),0);
  return `++ ${a.name} [GFF ${tot}pts] ++\n\n`+us.map(u=>{
    let rules=u.rules||"";const extra=[...(u.traits||[]),...(u.injuries||[]),...(u.talents||[]).filter(t=>t!=="Natural Talent"),...(u.skills||[]),...(u.ups||[]).map(x=>x.name)];
    if((u.talents||[]).includes("Toughened")){if(/Tough\((\d+)\)/i.test(rules))rules=rules.replace(/Tough\((\d+)\)/i,(m,n)=>`Tough(${+n+3})`);else if(u.models===1)extra.push("Tough(4)")}
    const all=[u.hero&&!/\bHero\b/.test(rules)?"Hero":"",u.tough>1&&!/Tough\(/i.test(rules)?`Tough(${u.tough})`:"",rules,...extra].filter(Boolean).join(", ");
    return `${u.name} [${u.models}] Q${u.q}+ D${u.d}+ | ${uval(u)}pts | ${all}\n${u.weapons||""}`.trim();
  }).join("\n\n")+"\n";
}

/* Army Forge text import */
function parseList(text){
  const lines=String(text).replace(/\r/g,"").split("\n");
  let armyName="";const units=[];let cur=null;
  const af=/^(.+?)\s*\[(\d+)\]\s*Q(\d)\+\s*D(\d)\+\s*\|\s*(\d+)\s*pts?\b\s*(?:\|\s*(.*))?$/i;
  for(const raw of lines){const l=raw.trim();let m;
    if(!l){cur=null;continue}
    if((m=l.match(/^\+\+\s*(.+?)\s*\+\+$/))){armyName=armyName||m[1].replace(/\[.*?\]|\(.*?\)/g,"").trim();continue}
    if((m=l.match(af))){const rest=m[6]||"";const toks=rest.split(",").map(s=>s.trim()).filter(Boolean);
      cur={name:m[1].trim(),models:+m[2],q:+m[3],d:+m[4],pts:+m[5],hero:/\bHero\b/i.test(rest),tough:+((rest.match(/Tough\((\d+)\)/i)||[])[1]||1),
        rules:toks.join(", "),weapons:""};
      const mm=cur.name.match(/^(\d+)\s*x\s+(.+)$/i);if(mm){cur.count=+mm[1];cur.name=mm[2].trim()}
      units.push(cur);continue}
    if(cur)cur.weapons=[cur.weapons,l].filter(Boolean).join("; ");
  }
  return {army:armyName,units:units.flatMap(u=>{const n=Math.min(10,u.count||1);delete u.count;return Array.from({length:n},()=>({...u}))})};
}

function progressSpec(){
  const c=D.camp,m=missions(),as=armies();const top=as.reduce((s,a)=>Math.max(s,a.vp||0),0);
  const items=c.type==="game"?[]:[[m,"missions played"]];items.push([as.length,"armies"]);
  if(c.type==="game")items.push([`${m}/${c.len}`,"missions"]);
  if(c.type==="points")items.push([`${top}/${c.len}`,"highest VP"]);
  if(c.type==="time"){const endD=timeEnd();items.push([fmtDate(endD.toISOString().slice(0,10)),"ends"])}
  return items.map(([v,l])=>`<div><b>${esc(v)}</b><span>${l}</span></div>`).join("");

function timeEnd(){const s=new Date((D.camp.start||today())+"T12:00:00");s.setDate(s.getDate()+7*(D.camp.len||5));return s}
function endState(){
  const c=D.camp;const as=standings();const lead=as[0]||null;
  if(c.over)return {over:true,winner:army(c.winner)||null,why:c.why||""};
  if(c.type==="game")return {over:false,why:`${Math.max(0,c.len-missions())} of ${c.len} missions left. Most VP after the last one wins.`};
  if(c.type==="points")return {over:false,why:`First army to ${c.len} VP after a match wins.`};
  if(c.type==="time"){const e=timeEnd();if(new Date()>e)return {over:true,winner:lead,why:`The ${c.len} weeks ran out on ${fmtDate(e.toISOString().slice(0,10))}. Most VP wins.`};
    const days=Math.ceil((e-new Date())/864e5);return {over:false,why:`${days} day${days===1?"":"s"} left. Most VP at the end wins.`}}
  return {over:false,why:"Endless campaign: keep climbing the leaderboard."};
}

function levelBox(a,u,p){

function importSheet(a,start){

      else{if(cost>(a.treasury||0))probs.push(`Costs ${cost} pts; the treasury has ${a.treasury}.`);if(newH>1||(newH&&heroUsed))probs.push("Only one new Hero can be recruited after each mission.");if(newH+heroes(a)>3)probs.push("An army can have at most 3 Heroes.")}

        ${rec&&!xpUsed?`<div class="field"><label for="xpOne">One recruit may start with 5 XP for +30 pts</label><select id="xpOne"><option value="">None</option>${parsed.map((u,i)=>pick.has(i)?`<option value="${i}" ${xpOne===i?"selected":""}>${esc(u.name)}</option>`:"").join("")}</select></div>`:""}
        <p class="row between"><span class="muted">Total</span><b class="num">${cost} pts</b></p>${probs.map(p=>`<p class="chip bad" style="align-self:flex-start">${esc(p)}</p>`).join("")}`:ta.trim()?`<p class="muted">No units found. Each unit line looks like <span class="num">Name [5] Q4+ D4+ | 100pts | rules</span>.</p>`:"";

      const xo=$("#xpOne");if(xo)xo.onchange=()=>{xpOne=xo.value===""?null:+xo.value;draw()};
    };

  else{const s=cr.sub,kind=cr.r===1?"Injury":"Talent";
    h+=`<b>${cr.r===1?"Injured: −15 pts":"Talent: +15 pts"}</b>`;
    if(s){h+=`<p><span class="d6 sm">${s.roll}</span> ${s.opts?`${esc(s.name)}: pick one <select data-cs="${u.id}"><option value="">Choose…</option>${s.opts.map(o=>`<option ${s.val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`:`<b>${esc(s.val)}</b> <span class="muted">${esc(desc(s.val))}</span>`}</p>`;
      if(s.val==="Dead")h+=no?`<p class="muted">No permadeath: loses this match's XP and sits out ${cr.sit} match${cr.sit>1?"es":""}.</p>`:`<p class="muted">Removed from the army.</p>`}
  }
  return h+`</div><button class="btn sm ghost" type="button" data-crx="${u.id}">Re-roll</button></div>`;
}
function pendingCas(l){let n=0;l.armies.forEach(id=>{if(l.conc.includes(id))return;(l.bring[id]||[]).forEach(uid=>{const r=l.res[uid];if(!r||!r.cas)return;const cr=l.cas[uid];if(!cr)n++;else if(cr.sub&&!cr.sub.val)n++})});return n}
function outcome(l){
  /* computes every change without saving: {armyId:{a, notes}} */
  const c=D.camp,no=c.opts&&c.opts.noPerma,out={},notes=[];LOGM=l.n;
  l.armies.forEach(id=>{const a=clone(army(id));if(!a)return;const ids=l.bring[id]||[];const conc=l.conc.includes(id);const an=[];
    a.units.forEach(u=>{if(u.sit&&!ids.includes(u.id)){u.sit--;if(!u.sit)an.push(`${u.name} is back from the sidelines.`)}});
    const keep=[];
    a.units.forEach(u=>{
      if(!ids.includes(u.id)){keep.push(u);return}
      const r=l.res[u.id]||{},cas=!!r.cas&&!conc,cr=l.cas[u.id];
      let xp=(cas?0:1)+(r.k||0)+2*(r.hk||0)+(r.x||0),dead=false,why=[];
      if(cas&&cr){
        if(!u.hero){if(cr.r===1)dead=true;if(cr.r===6){xp+=1;why.push("Natural Talent")}}
        else if(cr.r===1&&cr.sub){u.mod=(u.mod||0)-15;if(cr.sub.val==="Dead")dead=true;else{u.injuries=[...(u.injuries||[]),cr.sub.val];an.push(`${u.name} was injured: ${cr.sub.val}.`)}}
        else if(cr.r===6&&cr.sub){u.mod=(u.mod||0)+15;if(cr.sub.val==="Natural Talent")xp+=1;else u.talents=[...(u.talents||[]),cr.sub.val];an.push(`${u.name} gained the ${cr.sub.val} talent.`)}
      }
      if(dead){if(no){u.sit=cr.sit||1;an.push(`${u.name} is out of action for ${u.sit} match${u.sit>1?"es":""}.`);keep.push(u);return}
        an.push(`${u.name} died.`);return}
      const lv=addXP(a,u,xp);if(xp)an.push(`${u.name} +${xp} XP${lv?` and levels up`:""}.`);keep.push(u);
    });
    a.units=keep;
    const won=l.win.includes(id);let pts=won?80:160,vp=won?2:0;
    if(l.spec[id])pts+=40;const ad=l.adj[id]||{};pts+=+ad.t||0;vp+=+ad.v||0;
    a.treasury=(a.treasury||0)+pts;a.vp=(a.vp||0)+vp;a.played=(a.played||0)+1;
    alog(a,`Mission ${l.n}: ${won?"won":"lost"}${conc?" (conceded)":""}. +${vp} VP, +${pts} pts${l.spec[id]?" including 40 for the special objective":""}.`);
    out[id]={a,notes:an,won,pts,vp};notes.push(`${a.name}: ${won?"won":"lost"}, +${vp} VP, +${pts} pts.`,...an);
  });
  LOGM=null;return {out,notes};
}
function summaryHTML(l){if(!l.win.length)return "";const {out}=outcome(l);
  return `<div class="tbl"><table><tr><th>Army</th><th>Result</th><th>VP</th><th>Pts</th></tr>${Object.values(out).map(o=>`<tr><td>${esc(o.a.name)}</td><td>${o.won?"Won":"Lost"}</td><td class="num">+${o.vp}</td><td class="num">+${o.pts}</td></tr>`).join("")}</table></div>
    ${Object.values(out).some(o=>o.notes.length)?`<details class="ref"><summary>Unit changes</summary><ul>${Object.values(out).flatMap(o=>o.notes).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>`:""}`}
async function applyMatch(){
  const l=L();if(!l)return;const {out,notes}=outcome(l);const c=clone(D.camp);
  const before={camp:clone(D.camp),armies:{}};l.armies.forEach(id=>before.armies[id]=clone(army(id)));
  const mid=rid();
  c.missions=(c.missions||0)+1;
  const m={id:mid,n:l.n,date:today(),armies:l.armies,names:Object.fromEntries(l.armies.map(id=>[id,(army(id)||{}).name||""])),winners:l.win,
    obj:Object.fromEntries(l.armies.map(id=>[id,l.obj[id]?SPECIAL[l.obj[id].r-1][0]:""])),events:l.events.filter(e=>e.code).map(e=>e.code),notes,before};
  /* end conditions */
  const after=armies().map(a=>out[a.id]?out[a.id].a:a);
  const top=after.slice().sort((x,y)=>useRatio()?ratio(y)-ratio(x)||y.vp-x.vp:y.vp-x.vp)[0];
  if(c.type==="game"&&c.missions>=c.len){c.over=true;c.winner=top&&top.id;c.why=`All ${c.len} missions played. ${top?top.name:""} has the most VP.`}
  if(c.type==="points"){const hit=after.filter(a=>(a.vp||0)>=c.len).sort((x,y)=>y.vp-x.vp)[0];if(hit){c.over=true;c.winner=hit.id;c.why=`${hit.name} reached ${hit.vp} VP after mission ${l.n}.`}}
  for(const id of Object.keys(out))await put("armies/"+id,out[id].a);
  await put("matches/"+mid,m);await put("camp/main",c);await put("live/main",null);
  toast(`Mission ${l.n} applied.`);location.hash="armies";
}
function wireMatch(l0){
  const upd=fn=>{const l=L();fn(l);return saveLive(l)};
  $("#mCancel").onclick=()=>confirmSheet("Cancel this mission?","The setup and anything entered so far is discarded. Armies aren't changed.","Cancel mission",()=>put("live/main",null),true);
  document.querySelectorAll("[data-ma]").forEach(b=>b.onclick=()=>upd(l=>{const id=b.dataset.ma;if(l.armies.includes(id)){l.armies=l.armies.filter(x=>x!==id);delete l.bring[id]}else{l.armies.push(id);const a=army(id);l.bring[id]=a.units.filter(u=>!u.sit).map(u=>u.id)}}));
  document.querySelectorAll("[data-mb]").forEach(c=>c.onchange=()=>upd(l=>{const [aid,uid]=c.dataset.mb.split(",");const s=new Set(l.bring[aid]||[]);c.checked?s.add(uid):s.delete(uid);l.bring[aid]=[...s]}));
  document.querySelectorAll("[data-mall]").forEach(b=>b.onclick=()=>upd(l=>{const a=army(b.dataset.mall);l.bring[a.id]=a.units.filter(u=>!u.sit).map(u=>u.id)}));
  document.querySelectorAll("[data-mexp]").forEach(b=>b.onclick=()=>exportSheet(army(b.dataset.mexp),l0.bring[b.dataset.mexp]||[]));
  document.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>upd(l=>{l.obj[b.dataset.mo]={r:d6()}}));
  const on=(id,fn)=>{const el=$("#"+id);if(el)el.onclick=fn};
  on("mStart",()=>upd(l=>{l.stage="play";l.round=Math.max(1,l.round||1)}));
  on("rNext",()=>upd(l=>{l.round++}));
  on("rPrev",()=>upd(l=>{l.round=Math.max(1,l.round-1)}));
  on("evRoll",()=>upd(l=>{const r=d6();const e={round:l.round,r};if(r>=5){e.code=d6()*10+d6();const fx=EVENTS[e.code][2];
    if(fx){if(fx.pts==="d3x25")e.extra=`${d3()*25} pts`;else if(fx.vp==="d3")e.extra=`${d3()} VP`;else if(fx.xp==="d3")e.extra=`${d3()} XP`}}
    l.events=[...l.events.filter(x=>x.round!==l.round),e]}));
  const pickUnit=()=>{const all=[];l0.armies.forEach(id=>{const a=army(id);if(!a)return;a.units.filter(u=>(l0.bring[id]||[]).includes(u.id)).forEach(u=>all.push(`${u.name} (${a.name})`))});return all[Math.floor(Math.random()*all.length)]};
  on("rUnit",()=>{$("#rOut").textContent=`Random unit: ${pickUnit()||"none"}. Re-roll if it isn't eligible.`});
  on("rArmy",()=>{const a=army(l0.armies[Math.floor(Math.random()*l0.armies.length)]);$("#rOut").textContent=`Random army: ${a?a.name:"none"}.`});
  on("rQuarter",()=>{$("#rOut").textContent=`Table quarter ${1+Math.floor(Math.random()*4)}. Number them 1–4 clockwise from your left.`});
  document.querySelectorAll("[data-ud]").forEach(b=>b.onclick=()=>upd(l=>{const [id,n]=b.dataset.ud.split(",");l.under[id]=Math.max(0,(l.under[id]||0)+ +n)}));
  on("toAfter",()=>upd(l=>{l.stage="after"}));
  on("toSetup",()=>upd(l=>{l.stage="setup"}));
  on("backPlay",()=>upd(l=>{l.stage="play"}));
  document.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>upd(l=>{const id=b.dataset.win;l.win=l.win.includes(id)?l.win.filter(x=>x!==id):[...l.win,id]}));
  document.querySelectorAll("[data-conc]").forEach(c=>c.onchange=()=>upd(l=>{const id=c.dataset.conc;l.conc=c.checked?[...l.conc,id]:l.conc.filter(x=>x!==id)}));
  document.querySelectorAll("[data-spec]").forEach(c=>c.onchange=()=>upd(l=>{l.spec[c.dataset.spec]=c.checked}));
  document.querySelectorAll("[data-cas]").forEach(c=>c.onchange=()=>upd(l=>{const id=c.dataset.cas;l.res[id]={...(l.res[id]||{}),cas:c.checked};if(!c.checked)delete l.cas[id]}));
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>upd(l=>{const [id,k,n]=b.dataset.st.split(",");const r={...(l.res[id]||{})};r[k]=Math.max(0,(r[k]||0)+ +n);l.res[id]=r}));
  const rollCas=uid=>upd(l=>{const u=findUnit(uid);if(!u)return;const r=d6();const cr={r};
    if(u.hero&&r===1)cr.sub=rollInjury(u);if(u.hero&&r===6)cr.sub=rollTalent(u);cr.sit=d3();l.cas[uid]=cr});
  document.querySelectorAll("[data-cr]").forEach(b=>b.onclick=()=>rollCas(b.dataset.cr));
  document.querySelectorAll("[data-crx]").forEach(b=>b.onclick=()=>rollCas(b.dataset.crx));
  document.querySelectorAll("[data-cs]").forEach(s=>s.onchange=()=>upd(l=>{const cr=l.cas[s.dataset.cs];if(cr&&cr.sub)cr.sub.val=s.value||undefined}));
  document.querySelectorAll("[data-adj]").forEach(i=>i.onchange=()=>upd(l=>{const [id,k]=i.dataset.adj.split(",");l.adj[id]={...(l.adj[id]||{}),[k]:Math.round(+i.value||0)}}));
  on("apply",()=>{const {notes}=outcome(L());confirmSheet(`Apply mission ${l0.n}?`,`${notes.slice(0,8).map(esc).join("<br>")}${notes.length>8?"<br>…":""}`,"Apply",applyMatch)});
}
function findUnit(uid){for(const a of armies()){const u=(a.units||[]).find(x=>x.id===uid);if(u)return u}return null}

/* ---------- RULES TAB ---------- */
function renderRules(){
  const tbl=(rows,hd)=>`<div class="tbl"><table><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
  const six=t=>t.map(([n,d],i)=>[`<b class="num">${i+1}</b>`,`<b>${esc(n)}</b>`,esc(d)]);
  const sec=(t,b,open)=>`<details class="rule" ${open?"open":""}><summary><span>${t}</span></summary><div class="body">${b}</div></details>`;
  let h=CRULES.map(([t,b],i)=>sec(t,b,i===0)).join("");
  h+=sec("Special objectives",tbl(six(SPECIAL),["D6","Objective",""]));
  h+=sec("Unit traits (level-ups)",tbl(six(TRAITS),["D6","Trait",""]));
  h+=sec("Hero injuries",tbl(six(INJURIES),["D6","Injury",""]));
  h+=sec("Hero talents",tbl(six(TALENTS),["D6","Talent",""]));
  h+=sec("Hero skill sets",`<p>The first time a Hero levels up, roll: <b>1–2</b> Pathfinder or Captain · <b>3–4</b> Warrior or Hunter · <b>5–6</b> Warden or Overseer (pick one). Each level, roll a skill from the set: 1–2, 3–4, 5–6.</p>`+
    Object.entries(SKILLS).map(([s,list])=>`<h3>${s}</h3>`+tbl(list.map(([n,d],i)=>[`<b class="num">${["1–2","3–4","5–6"][i]}</b>`,`<b>${esc(n)}</b>`,esc(d)]),["D6","Skill",""])).join(""));
  h+=sec("Random events",`<p>Roll two dice one at a time: the first is the tens, the second the units.</p>`+tbl(Object.entries(EVENTS).map(([k,[n,d]])=>[`<b class="num">${k}</b>`,`<b>${esc(n)}</b>`,esc(d)]),["D66","Event",""]));
  $("#rulesBody").innerHTML=h+`<p class="muted" style="font-size:.86rem">Summarised from One Page Rules' Campaign Rules v3.6.0.</p>`;
}
